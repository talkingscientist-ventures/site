<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG image source — render at 1200x630</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Fixed light palette from assets/style.css — OG images don't follow the viewer's scheme */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; }
    .card {
      width: 1200px;
      height: 630px;
      background: #f4f4f2;
      color: #181815;
      font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 80px 56px;
      border-top: 14px solid #181815;
    }
    .mark { width: 132px; height: 14px; background: #d84910; margin-bottom: 42px; }
    h1 {
      font-family: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 700;
      font-size: 92px;
      line-height: 1.02;
      letter-spacing: -0.005em;
      text-transform: uppercase;
      max-width: 1000px;
    }
    .tag {
      font-size: 30px;
      line-height: 1.45;
      color: #55524a;
      max-width: 900px;
      margin-top: 30px;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 3px solid #181815;
      padding-top: 22px;
      font-family: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
      font-weight: 600;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .foot .url { color: #b23c06; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <div class="mark"></div>
      <h1>TalkingScientist Ventures</h1>
      <p class="tag">A product studio in Arkansas. Software tools and digital products for small businesses and tradespeople.</p>
    </div>
    <div class="foot">
      <span>Product studio &middot; Arkansas</span>
      <span class="url">talkingscientistventures.com</span>
    </div>
  </div>
</body>
</html>
